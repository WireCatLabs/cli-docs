[extend]
useDefault = true

# PostHog project keys are public by design: they can only send events, and the browser sees them anyway.
[[allowlists]]
description = "PostHog public project key"
condition = "AND"
paths = ['''^site\.config\.json$''']
regexes = ['''phc_[A-Za-z0-9]+''']

# Source fingerprints (sha256 of a page) are public; "oauth" in a page name makes the generic rule match them.
[[allowlists]]
description = "Translation source fingerprints"
condition = "AND"
paths = ['''^translations/sources\.json$''']
regexes = ['''[0-9a-f]{64}''']
