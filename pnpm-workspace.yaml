# pnpm blocks install scripts by default; each package is allowed by name.
allowBuilds:
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - "@leemour/cli-core@0.14.0"
  - '@leemour/cli-messaging@0.128.0'
patchedDependencies:
  '@fumadocs/base-ui@16.15.17': patches/@fumadocs__base-ui@16.15.17.patch
