# pnpm blocks install scripts by default; each package is allowed by name.
allowBuilds:
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - '@wirecat/*'

overrides:
  # serve 14.2.6 is its latest release and still allows compression 1.8.1 (GHSA-vc2v-76pw-4v95).
  serve>compression: 1.8.2
  # micromark-extension-math 3.1 (via markdownlint) allows only katex ^0.16 (GHSA-238p-pmpm-9mq7).
  micromark-extension-math>katex: 0.19.1
  # markdownlint 0.42.0 (its latest) pins re2js 2.8.6 exactly (GHSA-gg6h-894w-4m9c).
  markdownlint>re2js: 2.8.7

patchedDependencies:
  '@fumadocs/base-ui@16.17.8': patches/@fumadocs__base-ui@16.17.8.patch
