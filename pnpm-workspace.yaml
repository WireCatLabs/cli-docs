# pnpm blocks install scripts by default; each package is allowed by name.
allowBuilds:
  core-js: false
  esbuild: true
  lefthook: true
  sharp: true
minimumReleaseAgeExclude:
  - '@wirecat/cli-base@0.26.0'
  - '@wirecat/cli-core-onnx@1.0.0'
  - '@wirecat/cli-core-sqlite@1.0.0'
  - '@wirecat/cli-core@0.262.0'
  - '@wirecat/cli-tasks@0.2.0'
patchedDependencies:
  '@fumadocs/base-ui@16.15.17': patches/@fumadocs__base-ui@16.15.17.patch

overrides:
  serve>compression: 1.8.2
  markdownlint-cli2>smol-toml: 1.9.0
  micromark-extension-math>katex: 0.18.2
