name: Windows installation

on:
  pull_request:
  push:
    branches: [main]
  repository_dispatch:
    types: [docs]
  workflow_dispatch:
  schedule:
    - cron: "37 6 * * 1"

permissions:
  contents: read

jobs:
  install:
    runs-on: windows-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        tool: [max, tg]
        node: ["22.16.0", "24"]
        shell: [pwsh, powershell]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
      - name: Install and check the published CLI
        shell: ${{ matrix.shell }}
        env:
          WIRECAT_TOOL: ${{ matrix.tool }}
        run: ./scripts/windows-install.ps1 -Tool $env:WIRECAT_TOOL
