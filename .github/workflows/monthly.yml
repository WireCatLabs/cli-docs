name: Monthly validation

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@b8c56ea3471b09102dde9d5d2b851ae3a573e401 # v0.47.2
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
