name: Monthly validation

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@dc945ea8f81d394a24faf491a35b604d0f5752f3 # v0.102.0
    with:
      # audit.yml runs the dependency audits until picomatch is fixed (DOCS-14).
      dependencies: false
      languages: '["actions","javascript-typescript"]'
  audit:
    uses: ./.github/workflows/audit.yml
