name: Monthly validation

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@c1f6e9811a0c6d9d6f45df7ba06803702b4dbd7d # v0.95.0
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
