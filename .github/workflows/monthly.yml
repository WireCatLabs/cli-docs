name: Monthly validation

on:
  schedule:
    - cron: "20 3 1 * *"
  workflow_dispatch:

concurrency:
  group: monthly-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validation:
    uses: ./.github/workflows/ci.yml
  security:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@582fa50ee11d4ad56a7e8a08f6966a4d69edaeb8 # v0.75.1
    with:
      dependencies: true
      languages: '["actions","javascript-typescript"]'
