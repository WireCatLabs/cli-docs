name: Documentation release check

on:
  schedule:
    - cron: '17 7 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - tools.json
      - scripts/docs-updates.ts
      - .github/workflows/docs-updates.yml

permissions:
  contents: read
  issues: write

concurrency:
  group: documentation-release-check
  cancel-in-progress: false

jobs:
  check-releases:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compare published releases and maintain a review issue
        run: pnpm docs:updates --notify
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
      - name: Write the review report to the run summary
        if: always()
        run: |
          if [ -f .docs-updates/report.md ]; then
            cat .docs-updates/report.md >> "$GITHUB_STEP_SUMMARY"
          fi
