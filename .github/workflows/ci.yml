name: Full validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
      - run: nproc && free -m
      - name: next build with a watchdog
        run: |
          setsid pnpm exec next build --debug > build.log 2>&1 &
          pid=$!
          for i in $(seq 1 60); do
            sleep 15
            echo "=== t=$((i*15))s $(free -m | awk '/Mem:/{print "used",$3,"avail",$7} /Swap:/{print "swap",$3}' | tr '\n' ' ')"
            grep -v -E '│|┆' build.log | grep -E 'Compiled|static pages|Collecting|Error|error' | tail -2
            kill -0 $pid 2>/dev/null || break
          done
          if kill -0 $pid 2>/dev/null; then
            echo "=== STILL RUNNING after $((i*15))s: process tree"
            ps -eo pid,ppid,stat,rss,pcpu,etime,wchan:20,args --forest | grep -E 'node|next|pnpm' | grep -v grep | cut -c1-220
            for p in $(pgrep -f 'next' ); do echo "--- $p"; cat /proc/$p/status | grep -E 'State|VmRSS|Threads'; done
            echo "=== build.log tail"; grep -v -E '│|┆' build.log | tail -60
            kill -TERM -- -$pid; sleep 5; kill -KILL -- -$pid 2>/dev/null
            exit 1
          fi
          wait $pid && rc=0 || rc=$?; echo "build exit $rc"; grep -v -E '│|┆' build.log | tail -25; exit $rc
      - name: Memory and OOM report
        if: always()
        run: |
          sudo dmesg | grep -i -E 'oom|killed process' || echo "no oom in dmesg"
