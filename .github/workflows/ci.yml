name: Full validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
      - run: nproc && free -m
      - name: next build in a 13 GB cgroup, reporting its memory peak
        timeout-minutes: 15
        run: |
          sudo systemd-run --unit=nextbuild --wait --collect -p MemoryMax=13G -p MemorySwapMax=0 \
            -p User=runner -p WorkingDirectory="$PWD" -E PATH="$PATH" -E HOME="$HOME" -E CI=true \
            -p StandardOutput=file:"$PWD/build.log" -p StandardError=file:"$PWD/build.log" \
            "$(command -v pnpm)" exec next build && rc=0 || rc=$?
          sudo systemd-run --version | head -1
          echo "build exit $rc"
          grep -v -E '│|┆' build.log | grep -E 'Compiled|static pages|Error|Killed' | tail -6
          exit $rc
      - name: Memory and OOM report
        if: always()
        run: |
          sudo dmesg | grep -i -E 'oom|killed process' || echo "no oom in dmesg"
