name: Full validation

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-diag:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sample: [1, 2, 3]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm sync
      - run: nproc && free -m
      - name: next build with a memory sampler
        run: |
          ( while :; do echo "=== $(date -u +%T)"; free -m | sed -n 2,3p; ps -eo rss,etime,args --sort=-rss | head -5 | cut -c1-160; sleep 15; done ) > sampler.log 2>&1 &
          timeout 840 pnpm exec next build --debug 2>&1 | grep -v -E '│|┆' ; echo "build exit ${PIPESTATUS[0]}"
      - name: Memory and OOM report
        if: always()
        run: |
          sudo dmesg | grep -i -E 'oom|killed process' || echo "no oom in dmesg"
          awk '/^ +[0-9]+ +[0-9]+ +[0-9]+/{print}' sampler.log | sort -k3 -n | tail -2
          tail -40 sampler.log
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sampler-${{ matrix.sample }}
          path: sampler.log
          retention-days: 3
