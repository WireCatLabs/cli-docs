name: Security release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@34a442be7352a59598b0bdcccc03186ae1f6a728 # v0.85.1
    with:
      # audit.yml runs the dependency audits until picomatch is fixed (DOCS-14).
      dependencies: false
      languages: '["actions","javascript-typescript"]'
  audit:
    uses: ./.github/workflows/audit.yml
