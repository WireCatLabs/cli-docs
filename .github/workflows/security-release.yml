name: Security release

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    permissions:
      contents: read
      actions: read
      security-events: write
    uses: WireCatLabs/cli-base/.github/workflows/release-checks.yml@339f1ea6dbd83235664821b43aac26897a3f2659 # v0.132.0
    with:
      # audit.yml runs the dependency audits until picomatch is fixed (DOCS-14).
      dependencies: false
      languages: '["actions","javascript-typescript"]'
  audit:
    uses: ./.github/workflows/audit.yml
