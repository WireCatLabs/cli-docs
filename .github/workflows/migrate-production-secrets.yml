name: Migrate production secrets

on:
  workflow_dispatch:

permissions: {}

jobs:
  seal:
    if: github.ref == 'refs/heads/main'
    environment: production
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check sealed-box encryption with synthetic data
        shell: bash
        run: |
          php <<'PHP'
          <?php
          $pair = sodium_crypto_box_keypair();
          $sealed = sodium_crypto_box_seal('synthetic migration check', sodium_crypto_box_publickey($pair));
          if (sodium_crypto_box_seal_open($sealed, $pair) !== 'synthetic migration check') {
              throw new RuntimeException('Sealed-box round trip failed');
          }
          PHP
      - name: Encrypt existing secrets for the production environment
        shell: bash
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          umask 077
          php <<'PHP'
          <?php
          $key = base64_decode('6DIyIqWUyE8juV9S+yiQWMXkAusR9WlGFgefpqyWDyM=', true);
          if ($key === false || strlen($key) !== SODIUM_CRYPTO_BOX_PUBLICKEYBYTES) {
              throw new RuntimeException('Invalid production public key');
          }
          $names = ['CLOUDFLARE_API_TOKEN', 'CLOUDFLARE_ACCOUNT_ID'];
          $result = [];
          foreach ($names as $name) {
              $value = getenv($name);
              if ($value === false || $value === '') {
                  throw new RuntimeException('A required source secret is missing');
              }
              $result[$name] = [
                  'key_id' => '3380204578043523366',
                  'encrypted_value' => base64_encode(sodium_crypto_box_seal($value, $key)),
              ];
              sodium_memzero($value);
          }
          if (file_put_contents('production-secrets.sealed.json', json_encode($result, JSON_THROW_ON_ERROR)) === false) {
              throw new RuntimeException('Cannot save sealed secrets');
          }
          PHP
      - name: Save ciphertext for the authenticated environment-secret update
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: production-secrets-sealed
          path: production-secrets.sealed.json
          if-no-files-found: error
          retention-days: 1
