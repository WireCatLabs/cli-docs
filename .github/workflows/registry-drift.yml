name: Registry drift

# WireCat Desktop takes our tools from two places: the catalog compiled into each release and the signed list this
# site serves (scripts/official-tools.ts). This fails when either says something else than the CLI's latest manifest
# on npm. A release that changes a manifest turns it red until registry/official-manifests.json is refreshed.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "registry/**"
      - "tools.json"
      - "scripts/official-tools.ts"
      - "scripts/desktop-registry.ts"
      - ".github/workflows/registry-drift.yml"

permissions:
  contents: read
  issues: write

concurrency:
  group: registry-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Compare the list with npm and Desktop's catalog
        shell: bash
        run: node --experimental-strip-types scripts/official-tools.ts --check 2>&1 | tee drift.txt
      # A pull request opened with github.token starts no checks, so the job keeps one issue up to date instead.
      - name: Keep one issue open while the list lags a release
        if: failure() && github.event_name != 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --experimental-strip-types scripts/official-tools.ts || true
          {
            echo "The registry drift check failed: Desktop's signed list or its catalog says something else than a CLI's"
            echo "latest manifest on npm. Run: $RUN_URL"
            echo
            echo '```'
            cat drift.txt
            echo '```'
            echo
            echo "Manifests that changed since the last refresh:"
            echo
            echo '```'
            git diff --stat -- registry/
            echo '```'
            echo
            echo "To fix: run \`pnpm registry:official && pnpm exec biome format --write registry/\`, commit registry/official-manifests.json in a pull request, and"
            echo "add a known difference to registry/drift-allow.json only with its reason."
          } > issue.md
          title="Registry drift: Desktop's tool list lags a release"
          number=$(gh issue list --state open --search "\"$title\" in:title" --json number -q '.[0].number // ""')
          if [ -n "$number" ]; then
            last=$(gh issue view "$number" --json body,comments -q '(.comments | last | .body) // .body')
            [ "$last" = "$(cat issue.md)" ] || gh issue comment "$number" --body-file issue.md
          else
            gh issue create --title "$title" --body-file issue.md
          fi
