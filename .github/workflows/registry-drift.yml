name: Registry drift

# WireCat Desktop takes our tools from two places: the catalog compiled into each release and the signed list this
# site serves (scripts/official-tools.ts). This fails when either says something else than the CLI's latest manifest
# on npm. A release that changes a manifest turns it red until registry/official-manifests.json is refreshed.
on:
  schedule:
    - cron: "41 6 * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - "registry/**"
      - "tools.json"
      - "scripts/official-tools.ts"
      - "scripts/desktop-registry.ts"
      - ".github/workflows/registry-drift.yml"

permissions:
  contents: read

concurrency:
  group: registry-drift-${{ github.ref }}
  cancel-in-progress: true

jobs:
  drift:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: node --experimental-strip-types scripts/official-tools.ts --check
