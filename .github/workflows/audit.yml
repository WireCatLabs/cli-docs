name: Dependency audit

# The two dependency audits of cli-base's release-checks.yml, kept here only to skip picomatch's
# GHSA-fc5q-39xc-vjpf: no fixed picomatch exists, it runs only at build time (fumadocs globbing content
# files), and the static export sends visitors none of it. The shared check has no ignore input.
# Remove this file and restore `dependencies: true` when picomatch ships a fix or release-checks.yml
# takes an ignore list (DOCS-14).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      # Skips the advisory through audit.ignore in pnpm-workspace.yaml.
      - run: pnpm audit --prod --audit-level high

  resolved-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Audit a fresh production install of the package, without GHSA-fc5q-39xc-vjpf
        run: |
          audit_dir=$(mktemp -d)
          npm pack --ignore-scripts --pack-destination "$audit_dir" > /dev/null
          cd "$audit_dir"
          npm init --yes > /dev/null
          npm install --package-lock-only --ignore-scripts --omit=dev --no-audit --no-fund "$audit_dir"/*.tgz
          npm audit --omit=dev --json > audit.json || true
          jq -e '.vulnerabilities' audit.json > /dev/null
          jq -r '[.vulnerabilities[].via[] | objects | select(.severity == "high" or .severity == "critical")
            | select(.url | test("GHSA-fc5q-39xc-vjpf") | not) | "\(.severity) \(.name) \(.url)"] | unique | .[]' \
            audit.json > found.txt
          if [ -s found.txt ]; then cat found.txt; exit 1; fi
          echo "no high or critical advisories besides GHSA-fc5q-39xc-vjpf"
